name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # Needed once, so this workflow can turn GitHub Pages on if it is still off.
  administration: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Assemble site
        run: |
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' ./ _site/
          # The footer copy in the repo is the branch version. The published
          # site replaces it on every push so a refresh shows which deploy is live.
          ver="v${{ github.run_number }}-${GITHUB_SHA::0:7}"
          find _site -name '*.html' -print0 | xargs -0 -r sed -i "s#<span class=\"site-version\">[^<]*</span>#<span class=\"site-version\">${ver}</span>#g"
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
